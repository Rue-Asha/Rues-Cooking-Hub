eats.com%2Ftachyon%2F2024%2F06%2Favatar-guest-temp-cache-bust-duplicate.png&r=g","contentUrl":"https:\/\/secure.gravatar.com\/avatar\/75eae612677fdf550ba9a478ea595902153a0a06b8b27aaf6bc3eddcf6367244?s=96&d=https%3A%2F%2Fwww.recipetineats.com%2Ftachyon%2F2024%2F06%2Favatar-guest-temp-cache-bust-duplicate.png&r=g","caption":"Nagi"},"description":"I believe you can make great food with everyday ingredients even if you’re short on time and cost conscious. You just need to cook clever and get creative!","sameAs":["http:\/\/www.recipetineats.com\/about-me\/"],"url":"https:\/\/www.recipetineats.com\/author\/nagi-maehashigmail-com\/"},{"@type":"Recipe","name":"Butter Chicken","author":{"@type":"Person","name":"Nagi | RecipeTin Eats"},"description":"RECIPE VIDEO above. This is a Chef recipe and is one of the easiest Indian curries to make. The Butter Chicken Sauce is so good that you will want it on tap! Many restaurants take it over the top by adding copious amounts of ghee or butter into the sauce, but you&#39;ll find this rich enough as it is.And next time, try the streamlined One-Pan Baked Butter Chicken (readers are loving it!).","datePublished":"2019-01-06T18:00:00+00:00","image":["https:\/\/www.recipetineats.com\/tachyon\/2019\/01\/Butter-Chicken_5-SQ.jpg","https:\/\/www.recipetineats.com\/tachyon\/2019\/01\/Butter-Chicken_5-SQ.jpg?resize=500%2C500","https:\/\/www.recipetineats.com\/tachyon\/2019\/01\/Butter-Chicken_5-SQ.jpg?resize=500%2C375","https:\/\/www.recipetineats.com\/tachyon\/2019\/01\/Butter-Chicken_5-SQ.jpg?resize=480%2C270"],"recipeYield":["3","3 - 4"],"prepTime":"PT10M","cookTime":"PT25M","totalTime":"PT35M","recipeIngredient":["1\/2 cup plain yoghurt (, full fat)","1 tbsp lemon juice","1 tsp tumeric powder","2 tsp garam masala  ((Note 1))","1\/2 tsp chilli powder or cayenne pepper powder  ((Note 2))","1 tsp ground cumin","1 tbsp ginger, freshly grated","2 cloves garlic, crushed","1.5 lb \/ 750 g   chicken thigh fillets, cut into bite size pieces","2 tbsp (30 g)  ghee or butter,  ( OR 1 tbsp vegetable oil  (Note 3))","1 cup tomato passata (aka tomato puree) ((Note 4))","1 cup heavy \/ thickened cream ((Note 5))","1 tbsp sugar","1 1\/4 tsp salt","Basmati rice","White rice","Coriander\/cilantro (optional)"],"recipeInstructions":[{"@type":"HowToStep","text":"Optional blitz: for an extra smooth sauce, combine the Marinade ingredients (except the chicken) in a food processor and blend until smooth. (I do not do this)","name":"Optional blitz: for an extra smooth sauce, combine the Marinade ingredients (except the chicken) in a food processor and blend until smooth. (I do not do this)","url":"https:\/\/www.recipetineats.com\/butter-chicken\/#wprm-recipe-20255-step-0-0"},{"@type":"HowToStep","text":"Marinade: Combine the Marinade ingredients with the chicken in a bowl. Cover and refrigerate overnight, or up to 24 hours (minimum 3 hrs).","name":"Marinade: Combine the Marinade ingredients with the chicken in a bowl. Cover and refrigerate overnight, or up to 24 hours (minimum 3 hrs).","url":"https:\/\/www.recipetineats.com\/butter-chicken\/#wprm-recipe-20255-step-0-1"},{"@type":"HowToStep","text":"Cook chicken:&nbsp;Heat the ghee (butter or oil) over high heat in a large fry pan. Take the chicken out of the Marinade but do not wipe or shake off the marinade from the chicken (but don't pour the Marinade left in the bowl into the fry pan).&nbsp;","name":"Cook chicken:&nbsp;Heat the ghee (butter or oil) over high heat in a large fry pan. Take the chicken out of the Marinade but do not wipe or shake off the marinade from the chicken (but don't pour the Marinade left in the bowl into the fry pan).&nbsp;","url":"https:\/\/www.recipetineats.com\/butter-chicken\/#wprm-recipe-20255-step-0-2"},{"@type":"HowToStep","text":"Place chicken in the fry pan and cook for around 3 minutes, or until the chicken is white all over (it doesn't really brown because of the Marinade).","name":"Place chicken in the fry pan and cook for around 3 minutes, or until the chicken is white all over (it doesn't really brown because of the Marinade).","url":"https:\/\/www.recipetineats.com\/butter-chicken\/#wprm-recipe-20255-step-0-3"},{"@type":"HowToStep","text":"Sauce: Add the tomato passata, cream, sugar and salt. Also add any remaining marinade left in the bowl. Turn down to low and simmer for 20 minutes. Do a taste test to see if it needs more salt.","name":"Sauce: Add the tomato passata, cream, sugar and salt. Also add any remaining marinade left in the bowl. Turn down to low and simmer for 20 minutes. Do a taste test to see if it needs more salt.","url":"https:\/\/www.recipetineats.com\/butter-chicken\/#wprm-recipe-20255-step-0-4"},{"@type":"HowToStep","text":"Garnish with coriander\/cilantro leaves if using. Serve with basmati rice.","name":"Garnish with coriander\/cilantro leaves if using. Serve with basmati rice.","url":"https:\/\/www.recipetineats.com\/butter-chicken\/#wprm-recipe-20255-step-0-5"},{"@type":"HowToStep","text":"The Butter Chicken is pictured with my very easy No Yeast Flatbread and no-fry papadums (Note 5).","name":"The Butter Chicken is pictured with my very easy No Yeast Flatbread and no-fry papadums (Note 5).","url":"https:\/\/www.recipetineats.com\/butter-chicken\/#wprm-recipe-20255-step-0-6"}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.96","ratingCount":"1106","reviewCount":"13"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"We love this recipe! Easy to prepare &amp; a superb result. I add chopped cauliflower to the final simmer for added fibre &amp; texture. The cauliflower soaks up those lovely flavours(:","author":{"@type":"Person","name":"Karen K"},"datePublished":"2026-09-09"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Absolutely love this recipe, thank you so much! \r\nFor those that are finding it runny, you could try what I do, which is swapping the tomato purree for tomato paste instead (I use a can and a half, mixed with a quater cup of water to make it slightly thinner) \r\nIt makes it nice and thick, and very rich.","author":{"@type":"Person","name":"Sen"},"datePublished":"2026-09-07"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This is the BEST Butter Chicken! I'm so amazed I can make something so fabulous!!! I love your cookbook RTE Dinner, this is the second dinner this week from the the recipes. \r\n\r\nThank you Nagi\r\n\r\nWelcome to the family Jaffle &lt;3","author":{"@type":"Person","name":"Maria Davellis"},"datePublished":"2026-09-02"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This was my first time making Butter Chicken from scratch. \r\nThe recipe was very easy to follow. I had all the ingredients in the Pantry\/fridge and the grandchildren loved it. Their mum even wanted the recipe. 😀","author":{"@type":"Person","name":"Susanne J Budden"},"datePublished":"2026-09-02"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This dish was absolutely delicious. I added some sliced cucumber and it complemented the dish perfectly. Super easy and will definitely make it again. Thanks Nagi!","author":{"@type":"Person","name":"Sharon"},"datePublished":"2026-08-29"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Amazing, just lovely soft chicken in a great sauce","author":{"@type":"Person","name":"Jelmer Wolthuizen"},"datePublished":"2026-08-29"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Fantastic love it. the only thing that i added was almond flour  to thicken it quicker.","author":{"@type":"Person","name":"Anna Krause"},"datePublished":"2026-07-27"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This was my first real time having butter chicken, I don't count a bite of someone else's from a food truck 20 years ago.  I love the flavor!  I am looking forward to leftovers tomorrow!  I had to use ginger powder tho', I bought a knob of fresh ginger but can't find it!  I think it's somewhere in my car, biding it's time!","author":{"@type":"Person","name":"Lois"},"datePublished":"2026-07-27"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Yum, I love this recipe!","author":{"@type":"Person","name":"Anthea"},"datePublished":"2026-07-25"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I made this for a family of four and it was stunning - I savoured every bite of it and paired it with those instant pappadums 😎 Thanks for the recipe - definitely making again","author":{"@type":"Person","name":"Benjamin Oliver"},"datePublished":"2026-07-23"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"4"},"reviewBody":"Not quite perfect as it was delicious, but quite wet despite the simmering time. Could it be thickened with either plain, corn or chickpea flour?","author":{"@type":"Person","name":"Anne"},"datePublished":"2026-07-18"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Another amazing recipe from Nagi! I have made this recipe on many occasions, once even for 24 people at camping and everyone loved it. Don't despair if you decide to make it on a whim like I did today, I didn't have the luxury of marinating for the minimum 3 hours, and it still tasted wonderful even after a short marinade of 30 minutes. Thanks Nagi!!","author":{"@type":"Person","name":"Deandra"},"datePublished":"2026-07-17"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"OK, folks. I was sceptical that such a simple recipe could be really good, but all the comments were overwhelmingly positive, so I gave it a go. This is excellent and the marinade really does make it so. I only marinated the chicken for 1.25 hours, but even this was enough for a delicious flavour. I didn't use as much salt, as 1 tsp seemed excessive. I'd highly suggest undersalting and  tasting as you go. I will use this recipe from now on. Even the picky teenagers ate it.","author":{"@type":"Person","name":"Charlotte Bolcskey"},"datePublished":"2026-07-07"}],"recipeCategory":["Chicken","Curry"],"recipeCuisine":["Indian"],"keywords":"Butter Chicken","nutrition":{"@type":"NutritionInformation","servingSize":"310 g","calories":"402 kcal","carbohydrateContent":"9.8 g","proteinContent":"39.8 g","fatContent":"23.4 g","saturatedFatContent":"9.3 g","cholesterolContent":"193 mg","sodiumContent":"928 mg","fiberContent":"0.9 g","sugarContent":"6.5 g"},"@id":"https:\/\/www.recipetineats.com\/butter-chicken\/#recipe","isPartOf":{"@id":"https:\/\/www.recipetineats.com\/butter-chicken\/#article"},"mainEntityOfPage":"https:\/\/www.recipetineats.com\/butter-chicken\/"}]}</script>
